{% extends 'base.html' %}

{% block content %}
<h3>Manage Quizzes</h3>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Created At</th>
        </tr>
    </thead>
    <tbody>
        {% for quiz in quizzes %}
        <tr>
            <td>{{ quiz.title }}</td>
            <td>{{ quiz.category.name }}</td>
            <td>{{ quiz.created_at }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
